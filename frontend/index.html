<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>政策素材工作台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #d8dee7;
      --text: #182230;
      --muted: #667085;
      --brand: #1769aa;
      --brand-dark: #10558d;
      --selected: #eaf3fb;
      --ok: #16794d;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    header {
      height: 58px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: #fff;
      background: #182230;
      border-bottom: 1px solid #101828;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
    }

    main {
      display: grid;
      grid-template-columns: 350px minmax(0, 1fr);
      gap: 12px;
      height: calc(100vh - 58px);
      min-height: 650px;
      padding: 12px;
    }

    section {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .section-head {
      min-height: 50px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface-soft);
      border-bottom: 1px solid var(--line);
    }

    .section-head h2 {
      margin: 0;
      min-width: 0;
      font-size: 15px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .content {
      min-height: 0;
      padding: 12px;
      overflow: auto;
    }

    .stack { display: grid; gap: 10px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    label.field {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    input, select, button {
      min-height: 34px;
      border-radius: 4px;
      font: inherit;
    }

    input, select {
      width: 100%;
      padding: 7px 9px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--line);
    }

    button {
      padding: 7px 11px;
      font-weight: 600;
      color: var(--text);
      background: #eef2f6;
      border: 1px solid transparent;
      cursor: pointer;
    }

    button:hover { border-color: #aebccc; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    button.primary { color: #fff; background: var(--brand); }
    button.primary:hover { background: var(--brand-dark); }
    button.danger { color: var(--danger); background: #fff1f0; border-color: #ffd0cc; }

    .status {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .workspace-list {
      display: grid;
      gap: 7px;
      padding-top: 2px;
      border-top: 1px solid var(--line);
    }

    .workspace {
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
    }

    .workspace:hover { border-color: #aebccc; }
    .workspace.active { border-color: var(--brand); background: var(--selected); }
    .workspace-title { font-weight: 650; overflow-wrap: anywhere; }
    .workspace-meta { margin-top: 4px; color: var(--muted); font-size: 12px; }

    .review-toolbar {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .selection-count { font-weight: 650; color: var(--ok); }

    .agent-strip {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      background: #fbfcfd;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .policy-list { display: grid; }

    .policy-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 13px 12px;
      border-bottom: 1px solid #e8ecf1;
    }

    .policy-row.selected { background: #f3f8fc; }
    .policy-row input[type="checkbox"] { width: 17px; height: 17px; margin: 3px 0 0; accent-color: var(--brand); }

    .policy-title {
      display: inline;
      color: #164f7d;
      font-size: 15px;
      font-weight: 650;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .policy-title:hover { text-decoration: underline; }
    .policy-meta { margin-top: 4px; color: var(--muted); font-size: 12px; }

    .policy-excerpt {
      margin: 7px 0 0;
      color: #475467;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }

    .open-link {
      color: var(--brand);
      text-decoration: none;
      white-space: nowrap;
      font-size: 12px;
    }

    .open-link:hover { text-decoration: underline; }

    .empty {
      margin: 18px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      background: var(--surface-soft);
      border: 1px dashed var(--line);
      border-radius: 5px;
    }

    dialog {
      width: min(620px, calc(100vw - 24px));
      max-height: calc(100vh - 32px);
      padding: 0;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 18px 48px rgba(16, 24, 40, .2);
    }

    dialog::backdrop { background: rgba(16, 24, 40, .46); }
    .dialog-head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 16px; }
    .dialog-body { padding: 16px; display: grid; gap: 12px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .dialog-actions {
      padding: 12px 16px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: var(--surface-soft);
      border-top: 1px solid var(--line);
    }

    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; height: auto; }
      section { min-height: 500px; }
      header { padding: 0 12px; }
    }

    @media (max-width: 560px) {
      .policy-row { grid-template-columns: 24px minmax(0, 1fr); }
      .open-link { grid-column: 2; }
      .review-toolbar { align-items: flex-start; flex-direction: column; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header>
  <h1>政策素材工作台</h1>
  <div class="toolbar">
    <span id="globalStatus" class="status"></span>
    <button id="generateBtn" class="primary" disabled>按模板生成月报</button>
  </div>
</header>

<main>
  <section>
    <div class="section-head">
      <h2>采集工作区</h2>
      <div class="toolbar">
        <button id="newTaskBtn">新建</button>
        <button id="deleteTaskBtn" class="danger" disabled>删除</button>
      </div>
    </div>
    <div class="content stack">
      <label class="field">任务名称
        <input id="taskNameInput" placeholder="政策素材工作区">
      </label>
      <label class="field">固定信源
        <select id="sourceSelectInput">
          <option value="">加载中</option>
        </select>
      </label>
      <label class="field">栏目页 URL
        <input id="listPageUrlInput" placeholder="https://www.example.gov.cn/policy/">
      </label>
      <div class="row">
        <label class="field" style="flex:1">开始日期（可不填）
          <input id="startDateInput" type="date">
        </label>
        <label class="field" style="flex:1">结束日期（可不填）
          <input id="endDateInput" type="date">
        </label>
      </div>
      <label class="field">关键词
        <input id="keywordsInput" placeholder="人工智能,智能制造,大模型">
      </label>
      <div class="row">
        <label class="field" style="width:110px">最大链接数
          <input id="maxLinksInput" type="number" min="1" value="20">
        </label>
        <button id="collectBtn" class="primary" style="align-self:end; flex:1">创建并采集</button>
      </div>
      <div id="taskStatus" class="status"></div>
      <div id="tasksList" class="workspace-list"></div>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2 id="activeTaskTitle">政策链接</h2>
      <span id="policyStatus" class="status"></span>
    </div>
    <div class="review-toolbar">
      <div><span id="selectedCount" class="selection-count">已选 0 条</span><span id="totalCount" class="status"></span></div>
      <div class="toolbar">
        <button id="selectAllBtn" disabled>全选</button>
        <button id="clearSelectionBtn" disabled>清空</button>
        <button id="saveSelectionBtn" disabled>保存选择</button>
      </div>
    </div>
    <div id="agentRunStrip" class="agent-strip" hidden>
      <span><strong id="agentRunStatus">Agent</strong> <span id="agentRunStage"></span></span>
      <span id="agentRunMeta"></span>
    </div>
    <div id="policiesList" class="content policy-list">
      <div class="empty">请选择或创建一个工作区</div>
    </div>
  </section>
</main>

<dialog id="monthlyReportDialog">
  <form id="monthlyReportForm">
    <div class="dialog-head"><h2>生成工作月报</h2></div>
    <div class="dialog-body">
      <div class="form-grid">
        <label class="field">报告月份
          <input id="reportMonthInput" type="month" required>
        </label>
        <label class="field">统计截止日期
          <input id="reportStatDateInput" type="date" required>
        </label>
        <label class="field">本年第几期
          <input id="reportIssueInput" type="number" min="1" value="1" required>
        </label>
        <label class="field">总第几期
          <input id="reportTotalIssueInput" type="number" min="1" value="1" required>
        </label>
      </div>
      <label class="field">报送对象
        <input id="reportToInput" placeholder="省有关领导">
      </label>
      <label class="field">发送对象
        <input id="sendToInput" placeholder="各市工业和信息化局">
      </label>
      <label class="field">联系人及联系方式
        <input id="reportContactInput" placeholder="姓名 0531-XXXXXXXX">
      </label>
    </div>
    <div class="dialog-actions">
      <button id="closeReportDialogBtn" type="button">取消</button>
      <button id="reportSubmitBtn" class="primary" type="submit">生成并下载</button>
    </div>
  </form>
</dialog>

<script>
  const applicationUrl = window.location.protocol === 'file:'
    ? 'http://localhost:8081/'
    : `${window.location.origin}/`;
  if (window.location.protocol === 'file:') window.location.replace(applicationUrl);

  const state = {
    tasks: [],
    policies: [],
    sources: [],
    selectedTaskId: null,
    selectedPolicyIds: new Set(),
    selectionDirty: false,
    agentRun: null
  };

  const $ = (id) => document.getElementById(id);

  async function api(url, options = {}) {
    let response;
    try {
      response = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options
      });
    } catch (_) {
      throw new Error(`无法连接后端服务：${applicationUrl}`);
    }
    if (!response.ok) {
      let message = response.statusText;
      try {
        const body = await response.json();
        message = body.message || message;
      } catch (_) {}
      throw new Error(message);
    }
    return response;
  }

  async function loadSources() {
    try {
      const response = await api('/api/policy-sources');
      state.sources = await response.json();
      const select = $('sourceSelectInput');
      select.innerHTML = '<option value="">手动输入 URL</option>';
      state.sources.forEach(source => {
        const option = document.createElement('option');
        option.value = source.id;
        option.disabled = source.directCrawl === false;
        option.textContent = `${source.name}${source.directCrawl === false ? '（需适配）' : ''}`;
        select.appendChild(option);
      });
    } catch (error) {
      $('taskStatus').textContent = error.message;
    }
  }

  function applySelectedSource() {
    const source = state.sources.find(item => item.id === $('sourceSelectInput').value);
    if (!source) return;
    $('listPageUrlInput').value = source.url || '';
    $('keywordsInput').value = Array.isArray(source.keywords) ? source.keywords.join(',') : '';
    if (!$('taskNameInput').value) $('taskNameInput').value = source.name + '政策素材';
  }

  async function loadTasks(autoSelect = false) {
    const response = await api('/api/tasks/recent');
    state.tasks = await response.json();
    renderTasks();
    if (autoSelect && !state.selectedTaskId && state.tasks.length) {
      await selectTask(state.tasks[0].id);
    }
  }

  function renderTasks() {
    const container = $('tasksList');
    container.innerHTML = '';
    if (!state.tasks.length) {
      container.innerHTML = '<div class="empty">暂无工作区</div>';
      return;
    }
    state.tasks.forEach(task => {
      const node = document.createElement('div');
      node.className = 'workspace' + (task.id === state.selectedTaskId ? ' active' : '');
      const range = task.targetStartDate || task.targetEndDate
        ? `${task.targetStartDate || task.targetEndDate} 至 ${task.targetEndDate || task.targetStartDate}`
        : '不限发布日期';
      node.innerHTML = `
        <div class="workspace-title">${escapeHtml(task.taskName || ('工作区 ' + task.id))}</div>
        <div class="workspace-meta">${escapeHtml(range)} · 已采集 ${task.savedCount || 0} 条</div>
      `;
      node.addEventListener('click', () => selectTask(task.id));
      container.appendChild(node);
    });
  }

  async function selectTask(taskId) {
    state.selectedTaskId = taskId;
    state.selectionDirty = false;
    const task = state.tasks.find(item => item.id === taskId);
    if (task) {
      $('taskNameInput').value = task.taskName || '';
      $('listPageUrlInput').value = task.sourceUrl || '';
      $('startDateInput').value = task.targetStartDate || '';
      $('endDateInput').value = task.targetEndDate || '';
      $('keywordsInput').value = task.topics || '';
      $('activeTaskTitle').textContent = task.taskName || `工作区 ${taskId}`;
    }
    renderTasks();
    updateWorkspaceButtons();
    await Promise.all([loadPolicies(taskId), loadAgentRun(taskId)]);
  }

  function newWorkspace() {
    state.selectedTaskId = null;
    state.policies = [];
    state.selectedPolicyIds = new Set();
    state.selectionDirty = false;
    $('taskNameInput').value = '';
    $('listPageUrlInput').value = '';
    $('startDateInput').value = '';
    $('endDateInput').value = '';
    $('keywordsInput').value = '';
    $('activeTaskTitle').textContent = '政策链接';
    $('policiesList').innerHTML = '<div class="empty">填写栏目页后开始采集</div>';
    $('agentRunStrip').hidden = true;
    renderTasks();
    updateWorkspaceButtons();
    renderSelectionState();
  }

  async function deleteWorkspace() {
    if (!state.selectedTaskId) return;
    const task = state.tasks.find(item => item.id === state.selectedTaskId);
    if (!window.confirm(`删除“${task?.taskName || state.selectedTaskId}”及其中全部政策素材？`)) return;
    await api(`/api/tasks/${state.selectedTaskId}`, { method: 'DELETE' });
    newWorkspace();
    await loadTasks(false);
    $('taskStatus').textContent = '工作区已删除';
  }

  async function collectPolicies() {
    const startDate = $('startDateInput').value || null;
    const endDate = $('endDateInput').value || null;
    if (startDate && endDate && startDate > endDate) {
      $('taskStatus').textContent = '开始日期不能晚于结束日期';
      return;
    }
    if (!$('listPageUrlInput').value.trim()) {
      $('taskStatus').textContent = '请填写栏目页 URL';
      return;
    }

    const payload = {
      listPageUrl: $('listPageUrlInput').value.trim(),
      keywords: $('keywordsInput').value.split(',').map(item => item.trim()).filter(Boolean),
      maxLinks: Number($('maxLinksInput').value || 20),
      autoSummarize: false,
      targetStartDate: startDate,
      targetEndDate: endDate,
      taskName: $('taskNameInput').value.trim() || null,
      taskId: state.selectedTaskId
    };

    $('collectBtn').disabled = true;
    $('taskStatus').textContent = state.selectedTaskId ? '正在追加采集' : '正在创建并采集';
    try {
      const response = await api('/api/search/discover-and-save', {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      await loadTasks(false);
      await selectTask(result.taskId);
      $('taskStatus').textContent = `完成：新增 ${result.savedCount} 条，重复 ${result.duplicateCount} 条`;
    } catch (error) {
      $('taskStatus').textContent = error.message;
    } finally {
      $('collectBtn').disabled = false;
    }
  }

  async function loadPolicies(taskId) {
    $('policyStatus').textContent = '加载中';
    const response = await api(`/api/review/tasks/${taskId}/policies`);
    state.policies = await response.json();
    state.selectedPolicyIds = new Set(
      state.policies.filter(policy => policy.reviewStatus === 'APPROVED').map(policy => policy.id)
    );
    state.selectionDirty = false;
    renderPolicies();
    $('policyStatus').textContent = `${state.policies.length} 条`;
  }

  function renderPolicies() {
    const container = $('policiesList');
    container.innerHTML = '';
    if (!state.policies.length) {
      container.innerHTML = '<div class="empty">当前工作区暂无政策链接</div>';
      renderSelectionState();
      return;
    }
    state.policies.forEach(policy => {
      const selected = state.selectedPolicyIds.has(policy.id);
      const row = document.createElement('div');
      row.className = 'policy-row' + (selected ? ' selected' : '');
      const excerpt = shortText(policy.summary || policy.evidenceSnippet || policy.content || '正文抓取结果为空', 260);
      row.innerHTML = `
        <input type="checkbox" aria-label="选择政策" ${selected ? 'checked' : ''}>
        <div>
          <a class="policy-title" href="${escapeAttribute(policy.sourceUrl || '#')}" target="_blank" rel="noopener">${escapeHtml(policy.title || '未命名政策')}</a>
          <div class="policy-meta">${escapeHtml(policy.sourceName || '来源待核验')} · ${escapeHtml(policy.publishDate || '日期待核验')}</div>
          <p class="policy-excerpt">${escapeHtml(excerpt)}</p>
        </div>
        <a class="open-link" href="${escapeAttribute(policy.sourceUrl || '#')}" target="_blank" rel="noopener">打开原文</a>
      `;
      row.querySelector('input').addEventListener('change', event => {
        if (event.target.checked) state.selectedPolicyIds.add(policy.id);
        else state.selectedPolicyIds.delete(policy.id);
        state.selectionDirty = true;
        renderPolicies();
      });
      container.appendChild(row);
    });
    renderSelectionState();
  }

  function selectAll() {
    state.selectedPolicyIds = new Set(state.policies.map(policy => policy.id));
    state.selectionDirty = true;
    renderPolicies();
  }

  function clearSelection() {
    state.selectedPolicyIds.clear();
    state.selectionDirty = true;
    renderPolicies();
  }

  async function saveSelection(showMessage = true) {
    if (!state.selectedTaskId) return;
    const response = await api(`/api/review/tasks/${state.selectedTaskId}/selection`, {
      method: 'POST',
      body: JSON.stringify({ policyIds: [...state.selectedPolicyIds], reviewedBy: 'web-reviewer' })
    });
    await response.json();
    state.policies = state.policies.map(policy => ({
      ...policy,
      reviewStatus: state.selectedPolicyIds.has(policy.id) ? 'APPROVED' : 'PENDING_REVIEW'
    }));
    state.selectionDirty = false;
    renderSelectionState();
    if (showMessage) $('globalStatus').textContent = '选择已保存';
  }

  function openReportDialog() {
    if (!state.selectedTaskId || !state.selectedPolicyIds.size) return;
    const now = new Date();
    if (!$('reportMonthInput').value) {
      $('reportMonthInput').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }
    if (!$('reportStatDateInput').value) setReportMonthEndDate();
    $('monthlyReportDialog').showModal();
  }

  function setReportMonthEndDate() {
    const value = $('reportMonthInput').value;
    if (!value) return;
    const [year, month] = value.split('-').map(Number);
    const lastDay = new Date(year, month, 0).getDate();
    $('reportStatDateInput').value = `${year}-${String(month).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
  }

  async function generateReport(event) {
    event.preventDefault();
    if (!state.selectedTaskId || !state.selectedPolicyIds.size) return;
    const monthValue = $('reportMonthInput').value;
    const [reportYear] = monthValue.split('-').map(Number);
    const payload = {
      reportYear,
      issueNo: Number($('reportIssueInput').value),
      totalIssueNo: Number($('reportTotalIssueInput').value),
      reportMonth: monthValue,
      statDate: $('reportStatDateInput').value,
      reportTo: $('reportToInput').value.trim(),
      sendTo: $('sendToInput').value.trim(),
      contactInfo: $('reportContactInput').value.trim()
    };

    $('generateBtn').disabled = true;
    $('reportSubmitBtn').disabled = true;
    $('globalStatus').textContent = 'Agent 正在整理所选材料并填充月报模板';
    try {
      await saveSelection(false);
      const response = await api(`/api/reports/monthly/tasks/${state.selectedTaskId}`, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `山东省人工智能赋能制造业工作月报_${monthValue}.docx`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      $('monthlyReportDialog').close();
      $('globalStatus').textContent = '模板月报已生成';
      await loadAgentRun(state.selectedTaskId);
    } catch (error) {
      $('globalStatus').textContent = error.message;
    } finally {
      $('reportSubmitBtn').disabled = false;
      renderSelectionState();
    }
  }
  async function loadAgentRun(taskId) {
    try {
      const response = await fetch(`/api/agent/tasks/${taskId}`);
      state.agentRun = response.ok ? await response.json() : null;
    } catch (_) {
      state.agentRun = null;
    }
    const strip = $('agentRunStrip');
    if (!state.agentRun?.run) {
      strip.hidden = true;
      return;
    }
    const run = state.agentRun.run;
    const steps = state.agentRun.steps || [];
    const labels = {
      RUNNING: '执行中', WAITING_REVIEW: '等待选择素材', READY_FOR_REPORT: '可生成',
      GENERATING_REPORT: '生成中', COMPLETED: '已完成', PARTIAL_SUCCESS: '部分完成', FAILED: '失败'
    };
    $('agentRunStatus').textContent = `Agent · ${labels[run.status] || run.status}`;
    $('agentRunStage').textContent = run.currentStage || '';
    $('agentRunMeta').textContent = `${steps.length} 次 Tool 调用`;
    strip.title = run.lastError || '';
    strip.hidden = false;
  }

  function renderSelectionState() {
    const selected = state.selectedPolicyIds.size;
    $('selectedCount').textContent = `已选 ${selected} 条`;
    $('totalCount').textContent = ` / 共 ${state.policies.length} 条`;
    $('selectAllBtn').disabled = !state.policies.length;
    $('clearSelectionBtn').disabled = !selected;
    $('saveSelectionBtn').disabled = !state.selectedTaskId || !state.selectionDirty;
    $('generateBtn').disabled = !state.selectedTaskId || selected === 0;
  }

  function updateWorkspaceButtons() {
    const active = Boolean(state.selectedTaskId);
    $('deleteTaskBtn').disabled = !active;
    $('collectBtn').textContent = active ? '追加采集' : '创建并采集';
  }

  function shortText(value, maxLength) {
    const normalized = String(value || '').replace(/\s+/g, ' ').trim();
    return normalized.length <= maxLength ? normalized : normalized.slice(0, maxLength) + '…';
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
  }

  function escapeAttribute(value) { return escapeHtml(value); }

  $('sourceSelectInput').addEventListener('change', applySelectedSource);
  $('newTaskBtn').addEventListener('click', newWorkspace);
  $('deleteTaskBtn').addEventListener('click', deleteWorkspace);
  $('collectBtn').addEventListener('click', collectPolicies);
  $('selectAllBtn').addEventListener('click', selectAll);
  $('clearSelectionBtn').addEventListener('click', clearSelection);
  $('saveSelectionBtn').addEventListener('click', () => saveSelection(true));
  $('generateBtn').addEventListener('click', openReportDialog);
  $('monthlyReportForm').addEventListener('submit', generateReport);
  $('reportMonthInput').addEventListener('change', setReportMonthEndDate);
  $('closeReportDialogBtn').addEventListener('click', () => $('monthlyReportDialog').close());

  updateWorkspaceButtons();
  renderSelectionState();
  Promise.all([loadSources(), loadTasks(true)]).catch(error => {
    $('globalStatus').textContent = error.message;
  });
</script>
</body>
</html>
