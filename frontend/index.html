<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>政策日报审核台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --surface: #ffffff;
      --line: #d9e1ea;
      --text: #172033;
      --muted: #637083;
      --brand: #0b6bcb;
      --brand-dark: #084f96;
      --ok: #147a4b;
      --bad: #b42318;
      --warn: #9a5b00;
      --soft: #eef4fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
    }

    header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #172033;
      color: #fff;
      border-bottom: 1px solid #0f1726;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
    }

    main {
      display: grid;
      grid-template-columns: 340px minmax(420px, 1fr) 430px;
      gap: 12px;
      padding: 12px;
      height: calc(100vh - 56px);
      min-height: 680px;
    }

    section {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .section-head {
      min-height: 48px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #fbfcfe;
    }

    .section-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
    }

    .content {
      padding: 12px;
      overflow: auto;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 9px;
      color: var(--text);
      background: #fff;
      font: inherit;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
      line-height: 1.5;
    }

    button {
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 8px 11px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--soft);
      color: var(--text);
    }

    button:hover {
      border-color: #b8c8da;
    }

    button.primary {
      background: var(--brand);
      color: #fff;
    }

    button.primary:hover {
      background: var(--brand-dark);
    }

    button.danger {
      background: #fff2f0;
      color: var(--bad);
      border-color: #ffd0cc;
    }

    button.success {
      background: #eaf7f0;
      color: var(--ok);
      border-color: #bfe6d1;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .task,
    .policy {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fff;
      cursor: pointer;
    }

    .task.active,
    .policy.active {
      border-color: var(--brand);
      background: #f2f7fd;
    }

    .title {
      font-weight: 650;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      background: #eef2f7;
      color: #465365;
      border: 1px solid #dce3ec;
    }

    .badge.approved {
      background: #eaf7f0;
      color: var(--ok);
      border-color: #bfe6d1;
    }

    .badge.rejected {
      background: #fff2f0;
      color: var(--bad);
      border-color: #ffd0cc;
    }

    .badge.pending {
      background: #fff8e8;
      color: var(--warn);
      border-color: #f0d79b;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(64px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fbfcfe;
    }

    .metric strong {
      display: block;
      font-size: 18px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      padding: 18px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 6px;
      background: #fbfcfe;
    }

    .details {
      display: grid;
      gap: 10px;
    }

    .evidence {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fbfcfe;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    a {
      color: var(--brand);
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    a:hover {
      text-decoration: underline;
    }

    .status-line {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1120px) {
      main {
        grid-template-columns: 310px 1fr;
        height: auto;
      }

      section.details-panel {
        grid-column: 1 / -1;
        min-height: 520px;
      }
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
        padding: 8px;
      }

      header {
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>
<header>
  <h1>政策日报审核台</h1>
  <div class="toolbar">
    <button id="refreshTasksBtn">刷新任务</button>
    <button id="generateBtn" class="primary" disabled>生成日报</button>
  </div>
</header>

<main>
  <section>
    <div class="section-head">
      <h2>任务</h2>
      <span id="taskStatus" class="status-line"></span>
    </div>
    <div class="content stack">
      <div class="stack">
        <label>任务名称
          <input id="taskNameInput" placeholder="政策日报任务">
        </label>
        <label>固定信源
          <select id="sourceSelectInput">
            <option value="">正在加载固定信源...</option>
          </select>
          <span class="status-line">选择后会自动填写栏目页 URL 和关键词；标记“需适配”的信源暂不可直接采集。</span>
        </label>
        <label>栏目页 URL
          <input id="listPageUrlInput" placeholder="https://www.xxx.gov.cn/...">
        </label>
        <div class="row">
          <label style="flex:1">开始日期
            <input id="startDateInput" type="date">
          </label>
          <label style="flex:1">结束日期
            <input id="endDateInput" type="date">
          </label>
        </div>
        <label>关键词
          <input id="keywordsInput" placeholder="人工智能,智能制造,大模型">
        </label>
        <div class="row">
          <label style="width:120px">最大链接数
            <input id="maxLinksInput" type="number" min="1" value="10">
          </label>
          <label style="width:150px">自动摘要
            <select id="autoSummarizeInput">
              <option value="false">否</option>
              <option value="true">是</option>
            </select>
          </label>
          <button id="collectBtn" class="primary" style="align-self:end">收集</button>
        </div>
      </div>
      <div id="tasksList" class="stack"></div>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>审核列表</h2>
      <span id="policyStatus" class="status-line"></span>
    </div>
    <div class="content">
      <div class="summary-grid">
        <div class="metric"><strong id="totalCount">0</strong><span>全部</span></div>
        <div class="metric"><strong id="pendingCount">0</strong><span>待审</span></div>
        <div class="metric"><strong id="approvedCount">0</strong><span>通过</span></div>
        <div class="metric"><strong id="rejectedCount">0</strong><span>驳回</span></div>
        <div class="metric"><strong id="needsEditCount">0</strong><span>修改</span></div>
      </div>
      <div id="policiesList" class="stack"></div>
    </div>
  </section>

  <section class="details-panel">
    <div class="section-head">
      <h2>详情</h2>
      <span id="detailStatus" class="status-line"></span>
    </div>
    <div class="content">
      <div id="emptyDetail" class="empty">请选择政策</div>
      <div id="detailForm" class="details" hidden>
        <label>标题
          <textarea id="titleEdit"></textarea>
        </label>
        <div class="row">
          <label style="flex:1">来源单位
            <input id="sourceNameEdit">
          </label>
          <label style="width:150px">发布日期
            <input id="publishDateEdit" type="date">
          </label>
        </div>
        <label>分类
          <input id="categoryEdit">
        </label>
        <label>摘要
          <textarea id="summaryEdit"></textarea>
        </label>
        <label>审核意见
          <textarea id="reviewCommentEdit"></textarea>
        </label>
        <label>审核人
          <input id="reviewedByEdit" placeholder="reviewer">
        </label>
        <div class="toolbar">
          <button id="saveEditBtn">保存修改</button>
          <button id="approveBtn" class="success">通过</button>
          <button id="rejectBtn" class="danger">驳回</button>
        </div>
        <div>
          <div class="meta">原文链接</div>
          <a id="sourceUrlLink" href="#" target="_blank" rel="noopener"></a>
        </div>
        <div>
          <div class="meta">证据片段</div>
          <div id="evidenceBox" class="evidence"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
  const applicationUrl = window.location.protocol === 'file:'
    ? 'http://localhost:8081/'
    : `${window.location.origin}/`;
  if (window.location.protocol === 'file:') {
    window.location.replace(applicationUrl);
  }

  const state = {
    tasks: [],
    policies: [],
    sources: [],
    selectedTaskId: null,
    selectedPolicyId: null,
    summary: null
  };

  const $ = (id) => document.getElementById(id);

  const localDateInputValue = () => {
    const now = new Date();
    const localTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
    return localTime.toISOString().slice(0, 10);
  };

  const statusClass = (status) => {
    if (status === 'APPROVED') return 'approved';
    if (status === 'REJECTED') return 'rejected';
    return 'pending';
  };

  const statusText = (status) => ({
    PENDING_REVIEW: '待审核',
    APPROVED: '已通过',
    REJECTED: '已驳回',
    NEEDS_EDIT: '已修改'
  }[status] || status || '待审核');

  async function api(url, options = {}) {
    let response;
    try {
      response = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options
      });
    } catch (error) {
      throw new Error(`无法连接后端服务。请通过 ${applicationUrl} 打开审核台，并确认服务已启动。`);
    }
    if (!response.ok) {
      let message = response.statusText;
      try {
        const body = await response.json();
        message = body.message || message;
      } catch (_) {}
      throw new Error(message);
    }
    return response;
  }

  async function loadSources() {
    try {
      const response = await api('/api/policy-sources');
      state.sources = await response.json();
      renderSources();
    } catch (error) {
      $('taskStatus').textContent = '\u56fa\u5b9a\u4fe1\u6e90\u52a0\u8f7d\u5931\u8d25: ' + error.message;
    }
  }

  function renderSources() {
    const select = $('sourceSelectInput');
    select.innerHTML = '<option value="">&#25163;&#21160;&#36755;&#20837; URL</option>';
    state.sources.forEach(source => {
      const option = document.createElement('option');
      option.value = source.id;
      option.disabled = source.directCrawl === false;
      const suffix = source.directCrawl === false ? '\u9700\u9002\u914d' : (source.region || source.level || '');
      option.textContent = `${source.name} (${suffix})`;
      select.appendChild(option);
    });
  }

  function applySelectedSource() {
    const sourceId = $('sourceSelectInput').value;
    const source = state.sources.find(item => item.id === sourceId);
    if (!source) {
      return;
    }
    $('listPageUrlInput').value = source.url || '';
    $('keywordsInput').value = Array.isArray(source.keywords) ? source.keywords.join(',') : '';
    if (!$('taskNameInput').value) {
      const today = localDateInputValue();
      $('taskNameInput').value = `${today} ${source.name}`;
    }
  }

  async function loadTasks() {
    $('taskStatus').textContent = '加载中';
    try {
      const response = await api('/api/tasks/recent');
      state.tasks = await response.json();
      renderTasks();
      $('taskStatus').textContent = `${state.tasks.length} 个任务`;
    } catch (error) {
      $('taskStatus').textContent = error.message;
    }
  }

  function renderTasks() {
    const container = $('tasksList');
    container.innerHTML = '';
    if (!state.tasks.length) {
      container.innerHTML = '<div class="empty">暂无任务</div>';
      return;
    }
    state.tasks.forEach(task => {
      const node = document.createElement('div');
      node.className = 'task' + (task.id === state.selectedTaskId ? ' active' : '');
      node.innerHTML = `
        <div class="title">${escapeHtml(task.taskName || ('任务 ' + task.id))}</div>
        <div class="meta">${escapeHtml(task.targetStartDate || 'open')} 至 ${escapeHtml(task.targetEndDate || 'open')}</div>
        <div class="badges">
          <span class="badge">${escapeHtml(task.status || '')}</span>
          <span class="badge">保存 ${task.savedCount || 0}</span>
          <span class="badge">失败 ${task.failedCount || 0}</span>
        </div>
      `;
      node.addEventListener('click', () => selectTask(task.id));
      container.appendChild(node);
    });
  }

  async function selectTask(taskId) {
    state.selectedTaskId = taskId;
    state.selectedPolicyId = null;
    renderTasks();
    await Promise.all([loadSummary(taskId), loadPolicies(taskId)]);
    renderDetail(null);
  }

  async function loadSummary(taskId) {
    const response = await api(`/api/review/tasks/${taskId}/summary`);
    state.summary = await response.json();
    renderSummary();
  }

  function renderSummary() {
    const summary = state.summary || {};
    $('totalCount').textContent = summary.totalCount || 0;
    $('pendingCount').textContent = summary.pendingCount || 0;
    $('approvedCount').textContent = summary.approvedCount || 0;
    $('rejectedCount').textContent = summary.rejectedCount || 0;
    $('needsEditCount').textContent = summary.needsEditCount || 0;
    $('generateBtn').disabled = !state.selectedTaskId || !(summary.approvedCount > 0);
  }

  async function loadPolicies(taskId) {
    $('policyStatus').textContent = '加载中';
    const response = await api(`/api/review/tasks/${taskId}/policies`);
    state.policies = await response.json();
    renderPolicies();
    $('policyStatus').textContent = `${state.policies.length} 条政策`;
  }

  function renderPolicies() {
    const container = $('policiesList');
    container.innerHTML = '';
    if (!state.policies.length) {
      container.innerHTML = '<div class="empty">暂无政策</div>';
      return;
    }
    state.policies.forEach(policy => {
      const node = document.createElement('div');
      node.className = 'policy' + (policy.id === state.selectedPolicyId ? ' active' : '');
      node.innerHTML = `
        <div class="title">${escapeHtml(policy.title || '')}</div>
        <div class="meta">${escapeHtml(policy.sourceName || '')} · ${escapeHtml(policy.publishDate || '日期未知')}</div>
        <div class="meta">${escapeHtml(policy.sourceDomain || '')}</div>
        <div class="badges">
          <span class="badge ${statusClass(policy.reviewStatus)}">${statusText(policy.reviewStatus)}</span>
          <span class="badge">${escapeHtml(policy.authorityLevel || 'UNVERIFIED')}</span>
          <span class="badge">${escapeHtml(policy.filterStatus || '')}</span>
        </div>
      `;
      node.addEventListener('click', () => {
        state.selectedPolicyId = policy.id;
        renderPolicies();
        renderDetail(policy);
      });
      container.appendChild(node);
    });
  }

  function renderDetail(policy) {
    if (!policy) {
      $('emptyDetail').hidden = false;
      $('detailForm').hidden = true;
      $('detailStatus').textContent = '';
      return;
    }
    $('emptyDetail').hidden = true;
    $('detailForm').hidden = false;
    $('detailStatus').textContent = statusText(policy.reviewStatus);
    $('titleEdit').value = policy.title || '';
    $('sourceNameEdit').value = policy.sourceName || '';
    $('publishDateEdit').value = policy.publishDate || '';
    $('categoryEdit').value = policy.category || '';
    $('summaryEdit').value = policy.summary || '';
    $('reviewCommentEdit').value = policy.reviewComment || '';
    $('reviewedByEdit').value = policy.reviewedBy || '';
    $('sourceUrlLink').href = policy.sourceUrl || '#';
    $('sourceUrlLink').textContent = policy.sourceUrl || '';
    $('evidenceBox').textContent = policy.evidenceSnippet || policy.content || '';
  }

  async function collectTask() {
    const keywords = $('keywordsInput').value
      .split(',')
      .map(item => item.trim())
      .filter(Boolean);
    let startDate = $('startDateInput').value || null;
    let endDate = $('endDateInput').value || null;
    if (!startDate && endDate) startDate = endDate;
    if (startDate && !endDate) endDate = startDate;

    const payload = {
      taskName: $('taskNameInput').value || null,
      listPageUrl: $('listPageUrlInput').value,
      targetStartDate: $('startDateInput').value || null,
      targetEndDate: $('endDateInput').value || null,
      keywords,
      maxLinks: Number($('maxLinksInput').value || 10),
      autoSummarize: $('autoSummarizeInput').value === 'true'
    };
    if (payload.targetStartDate > payload.targetEndDate) {
      $('taskStatus').textContent = '开始日期不能晚于结束日期';
      return;
    }
    if (!payload.listPageUrl) {
      $('taskStatus').textContent = '请填写栏目页 URL';
      return;
    }
    $('taskStatus').textContent = '收集中';
    try {
      const response = await api('/api/search/discover-and-save', {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      await loadTasks();
      await selectTask(result.taskId);
      $('taskStatus').textContent = '收集完成';
    } catch (error) {
      $('taskStatus').textContent = error.message;
    }
  }

  async function saveEdit() {
    const policy = selectedPolicy();
    if (!policy) return;
    let startDate = $('startDateInput').value || null;
    let endDate = $('endDateInput').value || null;
    if (!startDate && endDate) startDate = endDate;
    if (startDate && !endDate) endDate = startDate;

    const payload = {
      title: $('titleEdit').value,
      sourceName: $('sourceNameEdit').value,
      publishDate: $('publishDateEdit').value || null,
      category: $('categoryEdit').value,
      summary: $('summaryEdit').value,
      reviewComment: $('reviewCommentEdit').value,
      reviewedBy: $('reviewedByEdit').value
    };
    await api(`/api/review/policies/${policy.id}`, {
      method: 'PATCH',
      body: JSON.stringify(payload)
    });
    await reloadSelectedTask('已保存');
  }

  async function reviewPolicy(action) {
    const policy = selectedPolicy();
    if (!policy) return;
    let startDate = $('startDateInput').value || null;
    let endDate = $('endDateInput').value || null;
    if (!startDate && endDate) startDate = endDate;
    if (startDate && !endDate) endDate = startDate;

    const payload = {
      reviewedBy: $('reviewedByEdit').value,
      reviewComment: $('reviewCommentEdit').value
    };
    await api(`/api/review/policies/${policy.id}/${action}`, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    await reloadSelectedTask(action === 'approve' ? '已通过' : '已驳回');
  }

  async function reloadSelectedTask(message) {
    if (!state.selectedTaskId) return;
    await Promise.all([loadSummary(state.selectedTaskId), loadPolicies(state.selectedTaskId)]);
    const policy = state.policies.find(item => item.id === state.selectedPolicyId);
    renderDetail(policy || null);
    $('detailStatus').textContent = message;
  }

  async function generateReport() {
    if (!state.selectedTaskId) return;
    $('taskStatus').textContent = '生成中';
    try {
      const response = await fetch(`/api/daily-tasks/${state.selectedTaskId}/reports`, { method: 'POST' });
      if (!response.ok) {
        const body = await response.json();
        throw new Error(body.message || response.statusText);
      }
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `政策日报_任务${state.selectedTaskId}.docx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      $('taskStatus').textContent = '已生成';
    } catch (error) {
      $('taskStatus').textContent = error.message;
    }
  }

  function selectedPolicy() {
    return state.policies.find(item => item.id === state.selectedPolicyId);
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  $('refreshTasksBtn').addEventListener('click', loadTasks);
  $('sourceSelectInput').addEventListener('change', applySelectedSource);
  $('collectBtn').addEventListener('click', collectTask);
  $('saveEditBtn').addEventListener('click', saveEdit);
  $('approveBtn').addEventListener('click', () => reviewPolicy('approve'));
  $('rejectBtn').addEventListener('click', () => reviewPolicy('reject'));
  $('generateBtn').addEventListener('click', generateReport);

  const defaultDate = localDateInputValue();
  $('startDateInput').value = defaultDate;
  $('endDateInput').value = defaultDate;

  loadSources();
  loadTasks();
</script>
</body>
</html>
